<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Signy — тестовый стенд NCALayer API</title>
  <style>
    body { font: 14px/1.4 -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; max-width: 1100px; }
    fieldset { margin: 10px 0; border: 1px solid #ccd; border-radius: 8px; }
    button { margin: 3px; padding: 6px 10px; }
    textarea { width: 100%; font: 12px ui-monospace, Menlo, monospace; }
    #log { white-space: pre-wrap; font: 12px ui-monospace, Menlo, monospace; background: #f5f6f8; padding: 10px; border-radius: 8px; max-height: 480px; overflow: auto; }
    .ok { color: #0a6; } .err { color: #c22; }
  </style>
</head>
<body>
  <h1>Тестовый стенд NCALayer API</h1>
  <p>Страница общается с «NCALayer» по <code>wss://127.0.0.1:13579</code> теми же сообщениями, что и госсайты.
    С установленным Signy соединение обслуживает расширение.</p>
  <div>Статус: <b id="status">не подключено</b> <button id="connect">Подключиться</button></div>

  <fieldset>
    <legend>Данные</legend>
    <label>XML <textarea id="xml" rows="3">&lt;login&gt;&lt;timeTicket&gt;1694567890123&lt;/timeTicket&gt;&lt;/login&gt;</textarea></label>
    <label>Текст/данные <textarea id="data" rows="2">Тестовый документ Signy ✓</textarea></label>
  </fieldset>

  <fieldset>
    <legend>kz.gov.pki.knca.commonUtils</legend>
    <button data-cmd="getActiveTokens">getActiveTokens</button>
    <button data-cmd="getKeyInfo">getKeyInfo</button>
    <button data-cmd="signXml">signXml (SIGNATURE)</button>
    <button data-cmd="signXmlAuth">signXml (AUTHENTICATION)</button>
    <button data-cmd="signXmls">signXmls</button>
    <button data-cmd="createCAdESFromBase64">createCAdESFromBase64 (attached)</button>
    <button data-cmd="createCMSSignatureFromBase64">createCMSSignatureFromBase64 (TSP)</button>
    <button data-cmd="createCAdESFromBase64Hash">createCAdESFromBase64Hash</button>
    <button data-cmd="changeLocale">changeLocale</button>
  </fieldset>

  <fieldset>
    <legend>kz.gov.pki.knca.basics</legend>
    <button data-cmd="basicsXml">sign xml</button>
    <button data-cmd="basicsXmlAuth">sign xml (auth, как eGov)</button>
    <button data-cmd="basicsCms">sign cms (detached)</button>
    <button data-cmd="basicsCmsTsp">sign cms + TSP</button>
    <button data-cmd="basicsMulti">sign cms ×3 (мультиподпись)</button>
    <button data-cmd="basicsRaw">sign raw + outputCert</button>
    <label><input type="checkbox" id="testChain" checked> chain: [] (разрешить тестовые ключи)</label>
  </fieldset>

  <fieldset>
    <legend>Прочее</legend>
    <button data-cmd="heartbeat">--heartbeat--</button>
    <button data-cmd="unknownModule">неизвестный модуль</button>
    <button data-cmd="probe">fetch https://127.0.0.1:13579 (no-cors)</button>
  </fieldset>

  <h3>Журнал</h3>
  <div id="log"></div>
  <script src="harness.js"></script>
</body>
</html>
